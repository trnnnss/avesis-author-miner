[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "avesis-author-miner"
version = "1.0.0"
description = "Configurable AVESIS publication collection and first-author prediction"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2,<4", "openpyxl>=3.1,<4", "requests>=2.32,<3",
    "beautifulsoup4>=4.12,<5", "scikit-learn>=1.6,<2", "joblib>=1.4,<2", "numpy>=1.26,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
avesis-miner = "avesis_miner.cli:main"

[tool.setuptools.packages.find]
include = ["avesis_miner*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
